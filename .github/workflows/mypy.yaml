name: mypy

# Lint, unit tests and the geoips unit tests are in integ_test.yaml (geoips_ci's
# reusable-ci). It does not type check, so mypy stays here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_SYSTEM_PYTHON: true

jobs:
  mypy:
    continue-on-error: true
    runs-on: ${{ vars.RUNNER }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0

      - name: Install package
        run: uv pip install -e ".[doc]" mypy

      - name: Run mypy
        run: mypy ./pluginify
